name: VS Code Extension CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: githydra-vscode/package-lock.json

      - name: Install dependencies
        run: cd githydra-vscode && npm install

      - name: Compile extension
        run: cd githydra-vscode && npm run compile

      - name: Package extension
        run: |
          cd githydra-vscode
          npx @vscode/vsce package --out githydra.vsix --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: githydra-extension
          path: githydra-vscode/githydra.vsix
